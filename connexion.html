<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">

<title>Connexion — Assokit</title>
<meta name="description" content="Connectez-vous à votre espace Assokit pour piloter vos projets associatifs.">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%23059669'/%3E%3Ccircle cx='22' cy='22' r='4.5' fill='%23FFFFFF'/%3E%3C/svg%3E">

<!-- Typographie Geist -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { margin: 0; padding: 0; min-height: 100vh; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }

:root {
  --acc: #059669;
  --acc-hover: #047857;
  --acc-light: #D1FAE5;
  --ink: #0A0A0B;
  --ink-2: #3F3F46;
  --ink-3: #71717A;
  --ink-4: #A1A1AA;
  --bg: #FFFFFF;
  --bg-2: #FAFAF9;
  --bg-3: #F4F4F5;
  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.14);
  --radius: 10px;
  --radius-lg: 14px;
  --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink: #FAFAFA; --ink-2: #D4D4D8; --ink-3: #A1A1AA; --ink-4: #71717A;
    --bg: #0A0A0B; --bg-2: #131315; --bg-3: #1C1C1F;
    --border: rgba(255, 255, 255, 0.08); --border-strong: rgba(255, 255, 255, 0.14);
    --acc-light: rgba(5, 150, 105, 0.15);
  }
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: -0.005em;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Halo vert décoratif en arrière-plan */
body::before {
  content: "";
  position: fixed;
  top: -300px;
  right: -300px;
  width: 700px;
  height: 700px;
  background: radial-gradient(circle, var(--acc-light) 0%, transparent 60%);
  opacity: 0.4;
  pointer-events: none;
  z-index: 0;
}

/* Barre de navigation minimale */
.nav {
  position: relative;
  z-index: 10;
  padding: 20px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 500;
  font-size: 16px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.logo-mark {
  width: 22px; height: 22px;
  background: var(--acc);
  border-radius: 6px;
  position: relative;
}
.logo-mark::after {
  content: "";
  position: absolute; right: 4px; bottom: 4px;
  width: 7px; height: 7px;
  background: #fff;
  border-radius: 50%;
}
.nav-back {
  font-size: 13px;
  color: var(--ink-3);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.nav-back:hover { color: var(--ink); }

/* Carte centrale */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  position: relative;
  z-index: 1;
}
.card {
  width: 100%;
  max-width: 420px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 40px 36px;
  animation: fadeUp 0.5s ease both;
}
.card-welcome {
  font-size: 12px;
  color: var(--acc);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.card-title {
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.025em;
  margin: 0 0 10px;
  line-height: 1.15;
}
.card-lede {
  font-size: 14px;
  color: var(--ink-3);
  margin: 0 0 28px;
  line-height: 1.55;
}

/* Formulaire */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  font-size: 15px;
  font-family: inherit;
  background: var(--bg);
  color: var(--ink);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.form-input:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px var(--acc-light);
}
.form-row-between {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  font-size: 13px;
}
.form-checkbox {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  color: var(--ink-2);
}
.form-checkbox input {
  accent-color: var(--acc);
}
.form-forgot {
  color: var(--acc);
  font-weight: 500;
}
.form-forgot:hover { text-decoration: underline; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 500;
  padding: 11px 20px;
  border-radius: var(--radius);
  transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
  letter-spacing: -0.01em;
  width: 100%;
}
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { opacity: 0.88; }

.sep {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  font-size: 12px;
  color: var(--ink-4);
  letter-spacing: 0.02em;
}
.sep::before, .sep::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.btn-ghost {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--border-strong);
}
.btn-ghost:hover { background: var(--bg-2); }
.btn-ghost svg { flex-shrink: 0; }

.signup-hint {
  margin-top: 28px;
  text-align: center;
  font-size: 13.5px;
  color: var(--ink-3);
}
.signup-hint a {
  color: var(--acc);
  font-weight: 500;
}
.signup-hint a:hover { text-decoration: underline; }

/* Footer minimal */
.foot {
  padding: 20px 24px;
  text-align: center;
  font-size: 12px;
  color: var(--ink-4);
  position: relative;
  z-index: 1;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

@media (max-width: 480px) {
  .nav { padding: 16px 18px; }
  .main { padding: 20px 18px; }
  .card { padding: 32px 24px; border-radius: 14px; }
  .card-title { font-size: 22px; }
}
</style>
</head>
<body>

<header class="nav">
  <a href="/" class="logo" aria-label="Accueil Assokit">
    <span class="logo-mark" aria-hidden="true"></span>
    <span>Assokit</span>
  </a>
  <a href="/" class="nav-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Retour au site
  </a>
</header>

<main class="main">
  <div class="card">
    <div class="card-welcome">Espace membre</div>
    <h1 class="card-title">Content de vous revoir.</h1>
    <p class="card-lede">Connectez-vous pour piloter vos projets et retrouver votre équipe.</p>

    <form method="POST" action="/api/login.php" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Adresse email</label>
        <input class="form-input" type="email" id="email" name="email" required autocomplete="email" placeholder="sophie@monasso.fr">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>

      <div class="form-row-between">
        <label class="form-checkbox">
          <input type="checkbox" name="remember" value="1">
          Rester connecté
        </label>
        <a href="/mot-de-passe-oublie" class="form-forgot">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>

    <div class="sep">ou</div>

    <a href="/api/auth/google" class="btn btn-ghost">
      <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      Continuer avec Google
    </a>

    <p class="signup-hint">
      Pas encore de compte ?
      <a href="/#tarifs">Rejoindre la bêta</a>
    </p>
  </div>
</main>

<footer class="foot">
  © 2026 Assokit · Hébergé en France
</footer>

</body>
</html>
