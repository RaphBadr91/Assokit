<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hors ligne — AssoKit</title>
<style>
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #f0fdf4, #ecfdf5); color: #1f2937; padding: 24px; }
.box { max-width: 420px; text-align: center; background: #fff; padding: 32px 28px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
.emoji { font-size: 48px; margin-bottom: 12px; }
h1 { font-size: 20px; margin: 0 0 8px; color: #059669; }
p { font-size: 14px; line-height: 1.55; color: #4b5563; margin: 0 0 18px; }
button { background: #10B981; color: #fff; border: 0; padding: 10px 22px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
button:hover { background: #059669; }
</style>
</head>
<body>
<div class="box">
  <div class="emoji">📡</div>
  <h1>Hors ligne</h1>
  <p>Tu n'as pas de connexion internet pour le moment. Vérifie ton réseau Wi-Fi ou tes données mobiles, puis recharge la page.</p>
  <button onclick="location.reload()">Réessayer</button>
</div>
</body>
</html>
