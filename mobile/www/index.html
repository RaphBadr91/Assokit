<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Assokit</title>
  <style>
    html,body{margin:0;height:100%;background:#059669;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
    .mark{width:88px;height:88px;border-radius:22px;background:#fff;position:relative;margin-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
    .mark::after{content:"";position:absolute;right:16px;bottom:16px;width:20px;height:20px;border-radius:50%;background:#059669}
    h1{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:0 0 6px}
    p{font-size:14px;opacity:.9;margin:0 0 22px;max-width:280px;line-height:1.5}
    button{background:#fff;color:#047857;border:0;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:600}
    .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark"></div>
    <h1>Assokit</h1>
    <div id="loading"><div class="spin"></div></div>
    <div id="offline" style="display:none">
      <p>Connexion indisponible. V&eacute;rifiez votre r&eacute;seau puis r&eacute;essayez.</p>
      <button onclick="go()">R&eacute;essayer</button>
    </div>
  </div>
  <script>
    // Ce fichier n'est affiche que si le serveur (server.url) est injoignable.
    function go(){ location.href = 'https://assokit.fr'; }
    function check(){
      fetch('https://assokit.fr/manifest.json', { cache: 'no-store', mode: 'no-cors' })
        .then(function(){ go(); })
        .catch(function(){
          document.getElementById('loading').style.display = 'none';
          document.getElementById('offline').style.display = 'block';
        });
    }
    setTimeout(check, 400);
  </script>
</body>
</html>
